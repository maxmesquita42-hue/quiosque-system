<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiosque | Mesas</title>
<style>
:root{--bg:#0f0f10;--card:#171719;--muted:#b9b9bd;--txt:#fff;--accent:#ff7a1a;--green:#2ecc71;--red:#ff4d4d}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:var(--txt);padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mesa{height:110px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;border:1px solid rgba(255,255,255,.08);cursor:pointer}
.livre{background:rgba(46,204,113,.12);color:#9af3bc}
.ocupada{background:rgba(255,77,77,.12);color:#ff9c9c}

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
.modal-content { background: var(--card); border: 1px solid rgba(255,122,26,.18); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; }
.order-list { margin: 15px 0; max-height: 200px; overflow-y: auto; }
.btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style></head>
<body>

<header><h1>Controle de Mesas</h1></header>
<div class="grid" id="gridMesas"></div>

<div class="modal-overlay" id="mesaModal">
  <div class="modal-content">
    <h2 id="modalTitle" style="color:var(--accent)">Mesa</h2>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// --- FUNÇÕES DE INTEGRAÇÃO (PADRÃO PARA TODOS OS ARQUIVOS) ---
function getDB() {
  const data = localStorage.getItem('sistemaQuiosque');
  return data ? JSON.parse(data) : { salao: {}, cozinha: [], historico: [] };
}

function saveDB(db) {
  localStorage.setItem('sistemaQuiosque', JSON.stringify(db));
}

// --- LÓGICA DO ARQUIVO MESAS ---
function renderizarMesas() {
  const db = getDB();
  const grid = document.getElementById('gridMesas');
  grid.innerHTML = "";

  for (let i = 1; i <= 8; i++) {
    const nomeMesa = `Mesa ${i}`;
    const dados = db.salao[nomeMesa] || { status: "Livre", total: 0, itens: [] };
    
    const div = document.createElement('div');
    div.className = `mesa ${dados.status === 'Ocupada' ? 'ocupada' : 'livre'}`;
    div.innerText = nomeMesa;
    div.onclick = () => abrirModal(nomeMesa, dados);
    grid.appendChild(div);
  }
}

function abrirModal(nome, dados) {
  const modal = document.getElementById('mesaModal');
  const body = document.getElementById('modalBody');
  document.getElementById('modalTitle').innerText = nome;

  if (dados.status === "Livre") {
    body.innerHTML = `<p style="text-align:center">Mesa Livre.</p><button class="btn" onclick="fecharModal()">Fechar</button>`;
  } else {
    body.innerHTML = `
      <div class="order-list">${dados.itens.map(i => `<div>${i}</div>`).join('')}</div>
      <p><strong>Total: R$ ${dados.total.toFixed(2)}</strong></p>
      <button class="btn" style="background:var(--green); color:#fff" onclick="encaminharParaCaixa('${nome}')">Enviar ao Caixa</button>
      <button class="btn" onclick="fecharModal()">Fechar</button>
    `;
  }
  modal.style.display = 'flex';
}

function fecharModal() { document.getElementById('mesaModal').style.display = 'none'; }

function encaminharParaCaixa(nomeMesa) {
  // Aqui o "conversar" acontece: removemos da mesa e enviamos para um status de "aguardando pagamento"
  // (Ou você pode redirecionar para o caixa.html direto)
  alert(nomeMesa + " enviada para o Caixa!");
  fecharModal();
}

window.addEventListener('focus', renderizarMesas);
renderizarMesas();
</script>
</body></html>
