<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiosque | Caixa</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;padding:22px}
.layout-caixa{display:grid;grid-template-columns:1fr 340px;gap:20px}
.card{background:#171719;border:1px solid rgba(255,122,26,.18);border-radius:20px;padding:18px;margin-bottom:16px}
h2{margin-top:0;color:#ff8d34;font-size:22px;border-bottom:1px solid #333;padding-bottom:10px}
.row-caixa{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:#0f0f10;border:1px solid #2a2a2c;margin-bottom:10px}
.mesa-tag{font-weight:bold;font-size:16px;color:#ff6d0f}
.valor-tag{font-weight:bold;color:#2ecc71;font-size:16px}
label{display:block;margin:12px 0 6px;color:#ddd}
select,input,button{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0f0f10;color:#fff;font-size:15px}
select:focus,input:focus{border-color:#ff8d34;outline:none}
button{margin-top:14px;background:linear-gradient(180deg,#ff8d34,#ff6d0f);border:none;font-weight:bold;cursor:pointer}
.resumo-valores{display:flex;justify-content:space-between;margin:8px 0;font-size:15px;color:#ccc}
.total-geral{font-size:20px;font-weight:bold;color:#2ecc71;border-top:1px dashed #333;padding-top:10px;margin-top:10px}

@media (max-width: 800px) {
  .layout-caixa { grid-template-columns: 1fr; }
}

/* --- ESTILO DE IMPRESSÃO DO CUPOM DO CAIXA (TERMIC PRINT) --- */
@media print {
  body * { display: none !important; }
  #cupom-caixa, #cupom-caixa * { display: block !important; }
  #cupom-caixa {
    position: absolute; left: 0; top: 0; width: 100%;
    color: #000 !important; background: #fff !important;
    font-family: 'Courier New', Courier, monospace !important; font-size: 13px !important;
    padding: 0; margin: 0;
  }
  .print-header { text-align: center; font-weight: bold; font-size: 15px; border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 10px; }
  .print-linha { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .print-total { border-top: 1px dashed #000; margin-top: 10px; padding-top: 6px; font-weight: bold; font-size: 15px; }
}
</style></head><body>

<h1>Fluxo de Caixa</h1>

<div class="layout-caixa">
  <div>
    <div class="card">
      <h2>Contas Pendentes</h2>
      <div id="listaContasPendentes"></div>
    </div>
    
    <div class="card">
      <h2>Últimos Recebimentos (Histórico)</h2>
      <div id="historicoCaixa"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Receber Pagamento</h2>
      
      <label>Mesa / Origem</label>
      <select id="caixaMesa" onchange="selecionarMesaCaixa()">
        </select>

      <label>Forma de Pagamento</label>
      <select id="caixaFormaPagamento">
        <option value="Dinheiro">Dinheiro</option>
        <option value="PIX">PIX</option>
        <option value="Cartão de Crédito">Cartão de Crédito</option>
        <option value="Cartão de Débito">Cartão de Débito</option>
      </select>

      <label>Valor Total (R$)</label>
      <input type="number" id="caixaValorTotal" step="0.01" placeholder="0,00">

      <button onclick="finalizarVendaCaixa()">Confirmar e Imprimir Cupom</button>
    </div>

    <div class="card">
      <h2>Resumo do Dia</h2>
      <div class="resumo-valores"><span>Total Dinheiro:</span><span id="resumoDinheiro">R$ 0,00</span></div>
      <div class="resumo-valores"><span>Total PIX:</span><span id="resumoPix">R$ 0,00</span></div>
      <div class="resumo-valores"><span>Total Cartões:</span><span id="resumoCartao">R$ 0,00</span></div>
      <div class="resumo-valores total-geral"><span>Faturamento:</span><span id="resumoTotalGeral">R$ 0,00</span></div>
    </div>
  </div>
</div>

<div id="cupom-caixa" style="display: none;"></div>

<script>
let statusSalao = {};
let historicoVendas = JSON.parse(localStorage.getItem('historicoCaixa')) || [];

function carregarDadosCaixa() {
  // Puxa as comandas atualizadas das mesas
  const dadosSalvos = localStorage.getItem('statusSalao');
  if (dadosSalvos) {
    statusSalao = JSON.parse(dadosSalvos);
  } else {
    statusSalao = {};
    for (let i = 1; i <= 8; i++) {
      statusSalao[`Mesa ${i}`] = { status: "Livre", total: 0, itens: [] };
    }
  }

  const listaPendentes = document.getElementById('listaContasPendentes');
  const listaHistorico = document.getElementById('historicoCaixa');
  const selectMesa = document.getElementById('caixaMesa');
  
  // 1. Renderiza Contas Pendentes e monta o select dinamicamente
  let htmlPendentes = '';
  let temPendente = false;
  
  let selectHTML = '<option value="">Selecione para receber</option>';

  for (let i = 1; i <= 8; i++) {
    const mesa = `Mesa ${i}`;
    const dados = statusSalao[mesa];
    
    if (dados && dados.status === "Ocupada" && dados.total > 0) {
      temPendente = true;
      htmlPendentes += `
        <div class="row-caixa" style="cursor:pointer;" onclick="carregarNoPainel('${mesa}', ${dados.total})">
          <span class="mesa-tag">${mesa}</span>
          <span style="color:#bbb; font-size:14px;">Aguardando pagamento</span>
          <span class="valor-tag">R$ ${dados.total.toFixed(2).replace('.', ',')}</span>
        </div>
      `;
      selectHTML += `<option value="${mesa}">${mesa} (Consumo Ativo)</option>`;
    }
  }
  
  selectHTML += `<option value="Venda Direta">Venda Direta (Balcão)</option>`;
  selectMesa.innerHTML = selectHTML;

  if (!temPendente) {
    htmlPendentes = `<p style="color:#bbb; text-align:center; padding: 10px; font-size:14px;">Nenhuma mesa pendente de pagamento no momento.</p>`;
  }
  listaPendentes.innerHTML = htmlPendentes;

  // 2. Renderiza Histórico de Recebimentos e soma faturamento
  let htmlHistorico = '';
  let somas = { Dinheiro: 0, PIX: 0, Cartao: 0, Total: 0 };

  if (historicoVendas.length === 0) {
    htmlHistorico = `<p style="color:#bbb; text-align:center; font-size:14px; padding: 10px;">Nenhum recebimento registrado hoje.</p>`;
  } else {
    historicoVendas.forEach(venda => {
      htmlHistorico += `
        <div class="row-caixa" style="border-color: rgba(46,204,113,0.15)">
          <span class="mesa-tag" style="color:#2ecc71">${venda.origem}</span>
          <span style="color:#bbb; font-size:14px;">Método: ${venda.metodo}</span>
          <span class="valor-tag">R$ ${venda.valor.toFixed(2).replace('.', ',')}</span>
        </div>
      `;
      
      // Classificação correta dos recebimentos para o Relatório do Dia
      if (venda.metodo === 'Dinheiro') {
        somas.Dinheiro += venda.valor;
      } else if (venda.metodo === 'PIX') {
        somas.PIX += venda.valor;
      } else {
        somas.Cartao += venda.valor; // Junta Crédito e Débito em "Cartões"
      }
      somas.Total += venda.valor;
    });
  }
  listaHistorico.innerHTML = htmlHistorico;

  // 3. Atualiza o Card de Resumo do Dia (Relatório de Faturamento)
  document.getElementById('resumoDinheiro').innerText = `R$ ${somas.Dinheiro.toFixed(2).replace('.', ',')}`;
  document.getElementById('resumoPix').innerText = `R$ ${somas.PIX.toFixed(2).replace('.', ',')}`;
  document.getElementById('resumoCartao').innerText = `R$ ${somas.Cartao.toFixed(2).replace('.', ',')}`;
  document.getElementById('resumoTotalGeral').innerText = `R$ ${somas.Total.toFixed(2).replace('.', ',')}`;
}

function carregarNoPainel(mesa, valor) {
  document.getElementById('caixaMesa').value = mesa;
  document.getElementById('caixaValorTotal').value = valor.toFixed(2);
}

function selecionarMesaCaixa() {
  const mesa = document.getElementById('caixaMesa').value;
  if (mesa && statusSalao[mesa] && statusSalao[mesa].status === "Ocupada") {
    document.getElementById('caixaValorTotal').value = statusSalao[mesa].total.toFixed(2);
  } else {
    document.getElementById('caixaValorTotal').value = '';
  }
}

function finalizarVendaCaixa() {
  const origem = document.getElementById('caixaMesa').value || "Venda Direta";
  const metodoSelect = document.getElementById('caixaFormaPagamento');
  const metodo = metodoSelect.options[metodoSelect.selectedIndex].text;
  const valorInput = document.getElementById('caixaValorTotal').value;

  if (!valorInput || parseFloat(valorInput) <= 0) {
    alert('Por favor, informe ou selecione um valor válido para recebimento!');
    return;
  }

  const valor = parseFloat(valorInput);

  // Gera o objeto da nova venda para o relatório
  const novaVenda = {
    id: Date.now(),
    origem: origem,
    metodo: metodo,
    valor: valor,
    data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR')
  };

  historicoVendas.unshift(novaVenda);
  localStorage.setItem('historicoCaixa', JSON.stringify(historicoVendas));

  // Libera a mesa e zera seu consumo se a origem for uma mesa real do salão
  if (origem !== "Venda Direta" && statusSalao[origem]) {
    statusSalao[origem].status = "Livre";
    statusSalao[origem].total = 0;
    statusSalao[origem].itens = [];
    localStorage.setItem('statusSalao', JSON.stringify(statusSalao));
  }

  // Dispara a impressão térmica do Cupom
  imprimirCupomFiscalCaixa(novaVenda);

  // Reseta os campos e recarrega as listas da tela
  document.getElementById('caixaMesa').value = '';
  document.getElementById('caixaValorTotal').value = '';
  carregarDadosCaixa();
}

function imprimirCupomFiscalCaixa(venda) {
  const cupomArea = document.getElementById('cupom-caixa');
  
  let cupomHTML = `
    <div class="print-header">
      QUIOSQUE SYSTEM<br>
      COMPROVANTE DE PAGAMENTO<br>
      ${venda.data}
    </div>
    <div class="print-linha">
      <span>Origem:</span>
      <span>${venda.origem}</span>
    </div>
    <div class="print-linha">
      <span>Forma Pagto:</span>
      <span>${venda.metodo}</span>
    </div>
    <div class="print-total class-linha">
      <div style="display:flex; justify-content:space-between; width:100%;">
        <span>TOTAL PAGO:</span>
        <span>R$ ${venda.valor.toFixed(2).replace('.', ',')}</span>
      </div>
    </div>
    <div style="text-align:center; margin-top:15px; font-size:11px; border-top:1px dashed #000; padding-top:5px;">
      Venda finalizada com sucesso!<br>
      Obrigado!
    </div>
  `;
  
  cupomArea.innerHTML = cupomHTML;
  window.print();
}

// Recarrega os dados caso você mude de aba no navegador e retorne
window.addEventListener('focus', carregarDadosCaixa);

// Inicialização imediata ao abrir o arquivo
carregarDadosCaixa();
</script>
</body></html>
