<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiosque | Cozinha</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;padding:22px}
.grid-pedidos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#171719;border:1px solid rgba(255,122,26,.18);border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.card-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:12px}
.mesa-titulo{font-size:20px;font-weight:bold;color:#ff8d34}
.hora-pedido{font-size:14px;color:#bbb}
.item-detalhe{font-size:16px;margin-bottom:14px;white-space:pre-line}
.item-qtd{font-weight:bold;color:#ff6d0f;font-size:18px}
button{padding:11px 14px;border-radius:12px;border:1px solid #333;color:#fff;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
.btn-print{background:#232326;border-color:#444}
.btn-concluir{background:linear-gradient(180deg,#2ecc71,#27ae60);border:none}

/* --- ESTILO DE IMPRESSÃO DA COMANDA TÉRMICA (WINDOWS PRINT) --- */
@media print {
  body * { display: none !important; } /* Oculta todo o painel escuro */
  #cupom-termico, #cupom-termico * { display: block !important; } /* Mostra apenas o cupom */
  #cupom-termico {
    position: absolute; left: 0; top: 0; width: 100%;
    color: #000 !important; background: #fff !important;
    font-family: 'Courier New', Courier, monospace !important; font-size: 14px !important;
    padding: 0; margin: 0;
  }
  .print-topo { text-align: center; font-weight: bold; font-size: 16px; border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 10px; }
  .print-corpo { font-size: 16px; margin: 10px 0; }
  .print-obs { font-style: italic; margin-top: 5px; }
  .print-rodape { text-align: center; font-size: 11px; border-top: 1px dashed #000; margin-top: 15px; padding-top: 4px; }
}
</style></head><body>

<h1>Comandas da Cozinha</h1>
<div class="grid-pedidos" id="listaCozinha">
  <!-- Os pedidos adicionados vão brotar aqui automaticamente -->
</div>

<!-- Área oculta que será preenchida e enviada para a impressora térmica -->
<div id="cupom-termico" style="display: none;"></div>

<script>
// Função que lê os dados enviados pelo botão "Adicionar Pedido" e monta as telas
function atualizarPainelCozinha() {
  const listaCozinha = document.getElementById('listaCozinha');
  const pedidos = JSON.parse(localStorage.getItem('pedidosCozinha')) || [];
  
  if (pedidos.length === 0) {
    listaCozinha.innerHTML = `<p style="color: #bbb; grid-column: 1/-1; text-align: center; margin-top: 20px;">Nenhum pedido pendente na cozinha.</p>`;
    return;
  }

  let htmlPedidos = '';
  pedidos.forEach((pedido, index) => {
    htmlPedidos += `
      <div class="card">
        <div>
          <div class="card-header">
            <span class="mesa-titulo">${pedido.mesa}</span>
            <span class="hora-pedido">${pedido.hora}</span>
          </div>
          <div class="item-detalhe">
            <span class="item-qtd">${pedido.quantidade}x</span> ${pedido.produto}
            <div style="color: #ff8d34; font-size: 14px; margin-top: 8px; font-weight: normal;">${pedido.observacoes}</div>
          </div>
        </div>
        <div>
          <button class="btn-print" onclick="imprimirCupomCozinha(${index})">Imprimir Comanda</button>
          <button class="btn-concluir" onclick="concluirPedidoCozinha(${index})">Concluir</button>
        </div>
      </div>
    `;
  });
  
  listaCozinha.innerHTML = htmlPedidos;
}

// Remove o pedido da lista da cozinha ao clicar em Concluir
function concluirPedidoCozinha(index) {
  let pedidos = JSON.parse(localStorage.getItem('pedidosCozinha')) || [];
  pedidos.splice(index, 1);
  localStorage.setItem('pedidosCozinha', JSON.stringify(pedidos));
  atualizarPainelCozinha();
}

// Formata o pedido no padrão de cupom para qualquer impressora térmica via Windows Print
function imprimirCupomCozinha(index) {
  const pedidos = JSON.parse(localStorage.getItem('pedidosCozinha')) || [];
  const pedido = pedidos[index];
  if (!pedido) return;

  const areaImpressao = document.getElementById('cupom-termico');
  
  areaImpressao.innerHTML = `
    <div class="print-topo">
      COZINHA - PEDIDO DE PRODUÇÃO<br>
      --------------------------------
    </div>
    <div class="print-corpo">
      <strong>MESA:</strong> ${pedido.mesa}<br>
      <strong>HORA:</strong> ${pedido.hora}<br>
      --------------------------------<br>
      <span style="font-size: 18px;"><strong>${pedido.quantidade}x ${pedido.produto}</strong></span>
      <div class="print-obs"><strong>OBS:</strong> ${pedido.observacoes}</div>
    </div>
    <div class="print-rodape">
      --------------------------------<br>
      Controle Interno de Produção
    </div>
  `;

  // Dispara a janela de impressão do Windows
  window.print();
}

// Fica checando a cada 3 segundos se entrou algum pedido novo vindo da tela de pedidos
setInterval(atualizarPainelCozinha, 3000);

// Executa assim que abre a página
atualizarPainelCozinha();
</script>
</body></html>
