<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiosque | Pedidos</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;padding:22px}
.card{max-width:760px;background:#171719;border:1px solid rgba(255,122,26,.18);border-radius:20px;padding:18px}
label{display:block;margin:12px 0 6px;color:#ddd} select,input,button,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0f0f10;color:#fff}
button{margin-top:14px;background:linear-gradient(180deg,#ff8d34,#ff6d0f);border:none;font-weight:bold;cursor:pointer}
</style></head><body>
<div class="card">
<h1>Novo Pedido</h1>

<label>Mesa</label>
<select id="selectMesa">
  <option value="Mesa 1">Mesa 1</option>
  <option value="Mesa 2">Mesa 2</option>
  <option value="Mesa 3">Mesa 3</option>
  <option value="Mesa 4">Mesa 4</option>
  <option value="Mesa 5">Mesa 5</option>
  <option value="Mesa 6">Mesa 6</option>
  <option value="Mesa 7">Mesa 7</option>
  <option value="Mesa 8">Mesa 8</option>
</select>

<label>Produto</label>
<select id="selectProduto">
  <option value="">Carregando produtos do cardápio...</option>
</select>

<label>Quantidade</label>
<input type="number" id="inputQuantidade" value="1" min="1">

<label>Observações</label>
<textarea id="txtObservacoes" rows="3" placeholder="Sem cebola, ponto da carne, etc."></textarea>

<button onclick="adicionarPedido()">Adicionar Pedido</button>
</div>

<script>
// Função para carregar dinamicamente todo o cardápio do seu arquivo menu.json
async function carregarCardapioCompleto() {
  const selectProduto = document.getElementById('selectProduto');
  try {
    const response = await fetch('/menu');
    const categorias = await response.json();
    
    let itensHTML = '<option value="">Selecione um produto</option>';
    
    // Varre todas as categorias do seu JSON (Hambúrgueres, Pastéis, etc.)
    for (const categoria in categorias) {
      categorias[categoria].forEach(item => {
        itensHTML += `<option value="${item.nome}">${item.nome} - R$ ${item.preco.toFixed(2).replace('.', ',')}</option>`;
      });
    }
    
    selectProduto.innerHTML = itensHTML;
  } catch (error) {
    console.error('Erro ao buscar o cardápio:', error);
    // Caso dê erro ou esteja rodando local sem o servidor, mantém os 3 de teste para não quebrar a tela
    selectProduto.innerHTML = `
      <option value="">Selecione um produto</option>
      <option value="Cheddar Burguer">Cheddar Burguer</option>
      <option value="Batata Premium">Batata Premium</option>
      <option value="Hot Dog do Chefe">Hot Dog do Chefe</option>
    `;
  }
}

// 3. Ao mudar o produto selecionado, escreve o nome dele direto na caixa de observações
document.getElementById('selectProduto').addEventListener('change', function() {
  const produtoNome = this.value;
  const campoObs = document.getElementById('txtObservacoes');
  
  if (produtoNome) {
    campoObs.value = `Item: ${produtoNome}\nObservações: `;
    campoObs.focus();
  } else {
    campoObs.value = '';
  }
});

// 4. Integração do botão Adicionar Pedido com o LocalStorage da Cozinha
function adicionarPedido() {
  const mesa = document.getElementById('selectMesa').value;
  const produto = document.getElementById('selectProduto').value;
  const quantidade = document.getElementById('inputQuantidade').value;
  const observacoes = document.getElementById('txtObservacoes').value;

  if (!produto) {
    alert('Por favor, selecione um produto antes de adicionar o pedido!');
    return;
  }

  // Monta a estrutura do pedido que a cozinha vai ler
  const dadosPedido = {
    id: Date.now(),
    mesa: mesa,
    produto: produto,
    quantidade: quantidade,
    observacoes: observacoes,
    hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  };

  // Pega a lista atual da cozinha, adiciona o novo e salva de volta
  let pedidosDaCozinha = JSON.parse(localStorage.getItem('pedidosCozinha')) || [];
  pedidosDaCozinha.push(dadosPedido);
  localStorage.setItem('pedidosCozinha', JSON.stringify(pedidosDaCozinha));

  // Alerta de sucesso e limpa o formulário mantendo pronto para o próximo item
  alert('Pedido enviado com sucesso para a tela da Cozinha!');
  document.getElementById('selectProduto').value = '';
  document.getElementById('inputQuantidade').value = '1';
  document.getElementById('txtObservacoes').value = '';
}

// Inicia a listagem assim que a página abre
carregarCardapioCompleto();
</script>
</body></html>
