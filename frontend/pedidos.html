<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiosque | Pedidos</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #111; color: #fff; padding: 22px; }
    .container-geral { max-width: 900px; margin: 0 auto; }
    .card { background: #171719; border: 1px solid rgba(255,122,26,0.18); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    button.btn-enviar { width: 100%; padding: 14px; background: linear-gradient(180deg, #ff8d34, #ff6d0f); border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 12px; }
    select, textarea { width: 100%; padding: 14px; background: #1f1f22; border: 1px solid #333; color: #fff; border-radius: 12px; }
  </style>
</head>
<body>

<div class="container-geral">
  <div class="card">
    <h2>Novo Pedido</h2>
    <form id="formPedido" onsubmit="enviarPedido(event)">
      <label>Mesa</label>
      <select id="selectMesa" required>
        <option value="">Selecione uma mesa</option>
        <option value="Mesa 1">Mesa 1</option><option value="Mesa 2">Mesa 2</option>
        <option value="Mesa 3">Mesa 3</option><option value="Mesa 4">Mesa 4</option>
        <option value="Mesa 5">Mesa 5</option><option value="Mesa 6">Mesa 6</option>
        <option value="Mesa 7">Mesa 7</option><option value="Mesa 8">Mesa 8</option>
      </select>
      <label>Produto</label>
      <select id="selectProduto" onchange="adicionarProdutoNaObs()"><option value="">Selecione um produto</option></select>
      <label>Itens do Pedido</label>
      <textarea id="obsPedido" rows="4"></textarea>
      <button type="submit" class="btn-enviar">Adicionar Pedido</button>
    </form>
  </div>
</div>

<script>
// --- FUNÇÕES DE INTEGRAÇÃO ---
function getDB() {
  const data = localStorage.getItem('sistemaQuiosque');
  return data ? JSON.parse(data) : { salao: {}, cozinha: [], historico: [] };
}

function saveDB(db) {
  localStorage.setItem('sistemaQuiosque', JSON.stringify(db));
}

// --- LÓGICA DO PEDIDO ---
function enviarPedido(event) {
  event.preventDefault();
  const mesa = document.getElementById('selectMesa').value;
  const obs = document.getElementById('obsPedido');
  const valor = parseFloat(obs.dataset.precoAcumulado) || 0;
  
  if (!mesa || !obs.value) return alert("Selecione mesa e itens!");

  let db = getDB();

  // 1. Atualiza dados da mesa no salão
  if (!db.salao[mesa]) db.salao[mesa] = { status: "Ocupada", total: 0, itens: [] };
  db.salao[mesa].status = "Ocupada";
  db.salao[mesa].total += valor;
  db.salao[mesa].itens.push(obs.value);

  // 2. Envia para a Cozinha
  db.cozinha.push({ id: Date.now(), mesa: mesa, itens: obs.value, hora: new Date().toLocaleTimeString() });

  saveDB(db);
  alert("Pedido enviado para a cozinha e para a mesa " + mesa + "!");
  document.getElementById('formPedido').reset();
  obs.dataset.precoAcumulado = 0;
}

function adicionarProdutoNaObs() {
  const select = document.getElementById('selectProduto');
  if (select.value) {
    const item = JSON.parse(select.value);
    const obs = document.getElementById('obsPedido');
    obs.value += (obs.value ? "\n" : "") + item.nome;
