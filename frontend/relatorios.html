<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiosque | Relatórios</title>
<style>
/* ... (mantenha todo o seu CSS original intacto) ... */
</style></head><body>

<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:10px;">
  <h1>Relatórios de Vendas</h1>
  <button onclick="window.print()">Imprimir Fechamento</button>
</div>

<div class="grid-cards">
  <div class="card"><h3>Faturamento Total</h3><div class="number green" id="lblFaturamento">R$ 0,00</div></div>
  <div class="card"><h3>Total de Vendas</h3><div class="number" id="lblTotalVendas">0</div></div>
  <div class="card"><h3>Ticket Médio</h3><div class="number" id="lblTicketMedio">R$ 0,00</div></div>
</div>

<h2>Detalhamento das Vendas</h2>
<div class="table-container">
  <table>
    <thead><tr><th>Hora</th><th>Origem</th><th>Método</th><th>Valor</th></tr></thead>
    <tbody id="corpoTabelaVendas"></tbody>
  </table>
</div>

<script>
// --- FUNÇÃO DE INTEGRAÇÃO ---
function getDB() {
  const data = localStorage.getItem('sistemaQuiosque');
  return data ? JSON.parse(data) : { salao: {}, cozinha: [], historico: [] };
}

// --- LÓGICA DO RELATÓRIO ---
function carregarRelatorios() {
  const db = getDB();
  const tabela = document.getElementById('corpoTabelaVendas');
  const historico = db.historico;

  if (historico.length === 0) {
    tabela.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhuma venda finalizada.</td></tr>`;
    return;
  }

  let faturamento = 0;
  tabela.innerHTML = historico.map(v => {
    faturamento += v.valor;
    return `<tr>
      <td>${v.data ? v.data.split(' ')[1] : ''}</td>
      <td style="color:#ff8d34;">${v.origem}</td>
      <td>${v.metodo}</td>
      <td style="color:#2ecc71;">R$ ${v.valor.toFixed(2)}</td>
    </tr>`;
  }).join('');

  // Atualiza Cards
  document.getElementById('lblFaturamento').innerText = `R$ ${faturamento.toFixed(2)}`;
  document.getElementById('lblTotalVendas').innerText = historico.length;
  document.getElementById('lblTicketMedio').innerText = `R$ ${(faturamento / historico.length).toFixed(2)}`;
}

window.addEventListener('focus', carregarRelatorios);
carregarRelatorios();
</script>
</body></html>
