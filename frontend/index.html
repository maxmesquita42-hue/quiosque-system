<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Quiosque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #ffffff; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #ccc; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; color: #ff4d4d; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Acesso ao Quiosque</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="admin@quiosque.com">
        </div>
        <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit">Entrar</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');
        
        messageDiv.innerText = '';

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                // Redireciona direto para o painel se o login estiver correto
                window.location.href = data.redirect;
            } else {
                messageDiv.innerText = data.message;
            }
        } catch (error) {
            console.error('Erro:', error);
            messageDiv.innerText = 'Erro ao conectar com o servidor.';
        }
    });
</script>

</body>
</html>
